<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plantilla: vite.config.js pone el fondo con background y las líneas con primary del tema -->
  <!-- Fondo -->
  <rect width="64" height="64" rx="12" fill="__BG__"/>
  <g fill="none" stroke="__FG__" stroke-width="3.5" stroke-linecap="round">
    <!-- Cuerpo del calendario -->
    <rect x="10" y="14" width="44" height="40" rx="5"/>
    <!-- Anillas -->
    <line x1="22" y1="8" x2="22" y2="18"/>
    <line x1="42" y1="8" x2="42" y2="18"/>
    <!-- Cabecera -->
    <line x1="10" y1="25" x2="54" y2="25"/>
    <!-- Rayas de los días -->
    <line x1="10" y1="35" x2="54" y2="35"/>
    <line x1="10" y1="44.5" x2="54" y2="44.5"/>
    <line x1="24.7" y1="25" x2="24.7" y2="54"/>
    <line x1="39.3" y1="25" x2="39.3" y2="54"/>
  </g>
</svg>
